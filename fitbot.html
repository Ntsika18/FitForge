<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>FitBot | FitForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-protected="true">
<div class="app">
  <header class="header">
    <div class="logo"><i class="fas fa-dumbbell"></i> FitForge</div>
    <div class="header-actions">
      <span class="user-email" id="userEmail" aria-label="Signed-in account"></span>
      <button class="theme-btn" id="themeBtn" type="button">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
      <button class="account-btn" id="logoutBtn" type="button" hidden>
        <i class="fas fa-arrow-right-from-bracket"></i>
        <span>Log out</span>
      </button>
    </div>
  </header>

  <section class="page active" id="page-fitbot">
 
    <!-- FitBot hero banner -->
    <div class="hero-banner">
      <img
        src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=800&q=80"
        alt="Gym equipment and weights"
        loading="lazy">
      <div class="hero-text">
        <h2>FitBot 🤖</h2>
        <p>Ask me anything fitness-related</p>
      </div>
    </div>
<div class="chat-wrap" id="fitbotWrap">
      <div class="chat-messages" id="fitbotMessages"></div>
      <div class="chat-input-bar">
        <textarea id="fitbotInput" rows="1" placeholder="Ask FitBot anything…"></textarea>
        <button class="send-btn" id="fitbotSendBtn" title="Send">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
 
  </section>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" href="index.html" id="nav-workout">
      <i class="fas fa-dumbbell"></i>
      Workout
    </a>
    <a class="nav-item" href="scanner.html" id="nav-scanner">
      <i class="fas fa-barcode"></i>
      Scanner
    </a>
    <a class="nav-item" href="saved.html" id="nav-saved">
      <i class="fas fa-bookmark"></i>
      Saved
    </a>
    <a class="nav-item active" href="fitbot.html" id="nav-fitbot" aria-current="page">
      <i class="fas fa-robot"></i>
      FitBot
    </a>
    <a class="nav-item" href="tips.html" id="nav-tips">
      <i class="fas fa-lightbulb"></i>
      Tips
    </a>
  </nav>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/fitbot.js"></script>
</body>
</html>
