<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Nutrition Scanner | FitForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-protected="true">
<div class="app">
  <header class="header">
    <div class="logo"><i class="fas fa-dumbbell"></i> FitForge</div>
    <div class="header-actions">
      <span class="user-email" id="userEmail" aria-label="Signed-in account"></span>
      <button class="theme-btn" id="themeBtn" type="button">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
      <button class="account-btn" id="logoutBtn" type="button" hidden>
        <i class="fas fa-arrow-right-from-bracket"></i>
        <span>Log out</span>
      </button>
    </div>
  </header>

  <section class="page active" id="page-scanner">
    <div class="page-heading">
      <h1>Nutrition Scanner</h1>
      <p>Scan or enter a barcode to see macros</p>
    </div>

    <!-- Large scanner UI block -->
    <div class="scanner-hero">
      <!-- Animated decorative barcode bars -->
      <div class="barcode-visual" id="barViz"></div>
      <div class="scanner-label">Scan a Barcode</div>
      <div class="scanner-sub">Enter a barcode number below, or try one of the demo products</div>
      <div class="scan-row">
        <input type="text" id="barcodeInput" placeholder="e.g. 4901234">
        <button class="btn" id="scanBtn"><i class="fas fa-search"></i> Scan</button>
      </div>
      <!-- Quick-fill demo chips -->
      <div class="hint-chips">
        <div class="chip" data-code="4901234">Protein Bar</div>
        <div class="chip" data-code="123456">Chicken Wrap</div>
        <div class="chip" data-code="999888">Greek Yogurt</div>
        <div class="chip" data-code="111222">Oatmeal Cup</div>
      </div>
    </div>

    <!-- Product result injected here by JS -->
    <div id="productResult"></div>
  </section>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item" href="index.html" id="nav-workout">
      <i class="fas fa-dumbbell"></i>
      Workout
    </a>
    <a class="nav-item active" href="scanner.html" id="nav-scanner" aria-current="page">
      <i class="fas fa-barcode"></i>
      Scanner
    </a>
    <a class="nav-item" href="saved.html" id="nav-saved">
      <i class="fas fa-bookmark"></i>
      Saved
    </a>
    <a class="nav-item" href="fitbot.html" id="nav-fitbot">
      <i class="fas fa-robot"></i>
      FitBot
    </a>
    <a class="nav-item" href="tips.html" id="nav-tips">
      <i class="fas fa-lightbulb"></i>
      Tips
    </a>
  </nav>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/scanner.js"></script>
</body>
</html>
