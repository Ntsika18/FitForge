<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Workout | FitForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-protected="true">
<div class="app">
  <header class="header">
    <div class="logo"><i class="fas fa-dumbbell"></i> FitForge</div>
    <div class="header-actions">
      <span class="user-email" id="userEmail" aria-label="Signed-in account"></span>
      <button class="theme-btn" id="themeBtn" type="button">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
      <button class="account-btn" id="logoutBtn" type="button" hidden>
        <i class="fas fa-arrow-right-from-bracket"></i>
        <span>Log out</span>
      </button>
    </div>
  </header>

  <section class="page active" id="page-workout">

    <!-- Hero banner — Unsplash gym photo -->
    <div class="hero-banner">
      <img
        src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=800&q=80"
        alt="Person lifting weights in gym"
        loading="lazy">
      <div class="hero-text">
        <h2>Build Your Plan</h2>
        <p>Tailored to your body & goals</p>
      </div>
    </div>

    <!-- Form card: weight, height, body type selects -->
    <div class="card">
      <div class="section-title"><i class="fas fa-sliders"></i> Your Profile</div>
      <div class="input-group">
        <div class="row">
          <div class="field">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="70" value="75" step="0.1">
          </div>
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="175" value="178" step="0.1">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Current Body</label>
            <select id="currentBody">
              <option value="slim">Slim</option>
              <option value="average" selected>Average</option>
              <option value="athletic">Athletic</option>
              <option value="heavy">Heavy</option>
            </select>
          </div>
          <div class="field">
            <label>Goal Body</label>
            <select id="idealBody">
              <option value="toned" selected>Toned</option>
              <option value="muscular">Muscular</option>
              <option value="lean">Lean</option>
              <option value="strong">Strong</option>
            </select>
          </div>
        </div>
        <button class="btn" id="generateWorkout" style="margin-top:0.2rem;">
          <i class="fas fa-bolt"></i> Generate My Workout
        </button>
      </div>

      <!-- Workout result injected here by JS -->
      <div id="workoutDisplay" class="workout-result">
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <i class="fas fa-clipboard-list" style="color:var(--accent);"></i>
          <span style="font-weight:700;">Your plan will appear here</span>
        </div>
        <p style="font-size:0.78rem;margin-top:0.3rem;color:var(--text2);">Fill in your details above &amp; tap Generate</p>
      </div>
    </div>
  </section>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <a class="nav-item active" href="index.html" id="nav-workout" aria-current="page">
      <i class="fas fa-dumbbell"></i>
      Workout
    </a>
    <a class="nav-item" href="scanner.html" id="nav-scanner">
      <i class="fas fa-barcode"></i>
      Scanner
    </a>
    <a class="nav-item" href="saved.html" id="nav-saved">
      <i class="fas fa-bookmark"></i>
      Saved
    </a>
    <a class="nav-item" href="fitbot.html" id="nav-fitbot">
      <i class="fas fa-robot"></i>
      FitBot
    </a>
    <a class="nav-item" href="tips.html" id="nav-tips">
      <i class="fas fa-lightbulb"></i>
      Tips
    </a>
  </nav>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/workout.js"></script>
</body>
</html>
